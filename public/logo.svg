<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 30 220 202" role="img" aria-label="Aggarwal Hardware &amp; Plywood Company logo">
  <!-- roof finial -->
  <path d="M150 40 L138 58 L150 52 L162 58 Z" fill="#48542F"/>

  <!-- house outline -->
  <path d="M60 150 L150 78 L240 150"
        fill="none" stroke="#3D3021" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 132 V222 M222 132 V222"
        fill="none" stroke="#3D3021" stroke-width="12" stroke-linecap="round"/>
  <path d="M78 222 L67 230 M222 222 L233 230"
        fill="none" stroke="#3D3021" stroke-width="10" stroke-linecap="round"/>

  <!-- roof window -->
  <g stroke="#3D3021" stroke-width="5" fill="none">
    <rect x="136" y="95" width="28" height="28"/>
    <path d="M150 95 V123 M136 109 H164"/>
  </g>

  <!-- lamp -->
  <g fill="#3D3021">
    <path d="M88 148 L112 148 L105 130 L95 130 Z"/>
    <rect x="98" y="148" width="4" height="60"/>
    <rect x="88" y="208" width="24" height="6" rx="2"/>
  </g>

  <!-- armchair -->
  <g fill="#48542F">
    <rect x="129" y="176" width="16" height="46" rx="3"/>
    <rect x="129" y="168" width="42" height="10" rx="3"/>
    <rect x="157" y="176" width="16" height="46" rx="3"/>
    <rect x="135" y="186" width="32" height="26" rx="4" opacity="0.85"/>
  </g>

  <!-- table and chair -->
  <g fill="#3D3021">
    <rect x="182" y="168" width="34" height="6" rx="2"/>
    <rect x="184" y="174" width="4" height="32"/>
    <rect x="210" y="174" width="4" height="32"/>
    <rect x="196" y="198" width="20" height="6" rx="2"/>
    <rect x="196" y="204" width="4" height="18"/>
    <rect x="212" y="204" width="4" height="18"/>
    <rect x="208" y="178" width="5" height="26" rx="2"/>
  </g>
</svg>
